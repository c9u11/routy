<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <!-- Solid background (Toss requires no transparency on app icon) -->
  <rect width="600" height="600" rx="132" fill="#1677ff"/>

  <!-- Soft inner glow for depth -->
  <rect x="0" y="0" width="600" height="600" rx="132" fill="url(#glow)" opacity="0.18"/>

  <!-- Path: S(top-left) → mid → bottom-right(D), 4-segment winding route -->
  <path
    d="M150 150 L150 300 L300 300 L300 450 L450 450"
    stroke="white"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.96"
  />

  <!-- Path waypoint nodes -->
  <circle cx="150" cy="300" r="32" fill="white" opacity="0.88"/>
  <circle cx="300" cy="300" r="32" fill="white" opacity="0.88"/>
  <circle cx="300" cy="450" r="32" fill="white" opacity="0.88"/>

  <!-- Decorative unused grid nodes (subtle, evokes a puzzle grid) -->
  <circle cx="450" cy="150" r="18" fill="white" opacity="0.32"/>
  <circle cx="450" cy="300" r="18" fill="white" opacity="0.32"/>
  <circle cx="150" cy="450" r="18" fill="white" opacity="0.32"/>

  <!-- S (start) — blue with white ring -->
  <circle cx="150" cy="150" r="52" fill="#4096ff" stroke="white" stroke-width="20"/>

  <!-- D (destination) — green with white ring -->
  <circle cx="450" cy="450" r="52" fill="#52c41a" stroke="white" stroke-width="20"/>

  <defs>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
