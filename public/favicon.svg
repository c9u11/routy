<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1677ff"/>
  <!-- 3×3 grid path: S(top-left) → mid → bottom-right (D), winding -->
  <path d="M16 16 L16 32 L32 32 L32 48 L48 48"
    stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <!-- nodes on path -->
  <circle cx="16" cy="32" r="3.5" fill="white" opacity="0.85"/>
  <circle cx="32" cy="32" r="3.5" fill="white" opacity="0.85"/>
  <circle cx="32" cy="48" r="3.5" fill="white" opacity="0.85"/>
  <!-- decorative unused nodes -->
  <circle cx="48" cy="16" r="2" fill="white" opacity="0.3"/>
  <circle cx="48" cy="32" r="2" fill="white" opacity="0.3"/>
  <circle cx="16" cy="48" r="2" fill="white" opacity="0.3"/>
  <!-- Start (S) and Destination (D) endpoints -->
  <circle cx="16" cy="16" r="5.5" fill="#4096ff" stroke="white" stroke-width="2.2"/>
  <circle cx="48" cy="48" r="5.5" fill="#52c41a" stroke="white" stroke-width="2.2"/>
</svg>
